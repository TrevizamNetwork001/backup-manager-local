  <nav aria-label="Navegação principal">
    <span class="nav-group-title">Operação</span>
    <a href="/"><svg class="nav-icon" aria-hidden="true"><use href="#nav-dashboard"/></svg><span>Dashboard</span></a>
    <a href="/backups"><svg class="nav-icon" aria-hidden="true"><use href="#nav-backups"/></svg><span>Backups</span></a>
    <a href="/jobs"><svg class="nav-icon" aria-hidden="true"><use href="#nav-jobs"/></svg><span>Jobs</span></a>
    {{operation_admin}}
    {{services_navigation}}
    {{administration}}
  </nav>

    {{system_status}}
    <div class="sidebar-user"><span class="avatar" aria-hidden="true">{{avatar_content}}</span><div><strong>{{username}}</strong><small>Backup Manager</small></div></div>
    <form class="sidebar-logout" method="post" action="/logout"><button class="ghost" type="submit"><svg class="nav-icon" aria-hidden="true"><use href="#nav-logout"/></svg><span>Sair</span></button></form>
  </footer>
